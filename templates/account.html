{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block shell %}My Account{% endblock %}
{% block body %}
<main class="page">
  <div class="breadcrumb"><a href="{{ url_for('home') }}">Home</a> / Change Password</div>
  <form class="panel pad narrow" method="post">
    <h1 class="title">Change Password</h1>
    <p class="subtitle">{{ g.user.email }}</p>
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div class="field"><label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="new">New password (at least 10 characters)</label><input id="new" name="new" type="password" minlength="10" autocomplete="new-password" required></div>
    <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" minlength="10" autocomplete="new-password" required></div>
    <div class="actions"><button class="btn emph" type="submit">Change Password</button></div>
  </form>
</main>
{% endblock %}
